name: Deploy Vite Site to GitHub Pages

on:
  push:
    branches: [ "main" ] # Воркфлоу сработает при пуше в ветку main

  # Позволяет запускать сборку вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем права для работы с GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один активный деплой одновременно
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
